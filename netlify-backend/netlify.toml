# This is a separate Netlify site from your GitHub Pages itinerary -- it
# exists only to run the bookings function. Deploy it by running
# `netlify deploy --prod` from inside this folder (see ../SETUP.md).

[build]
  # Nothing in here but a harmless placeholder page -- the real content is
  # the function itself, which is never served as a static file. Keeping
  # this separate from the function source means the source (and the
  # booking data + links hardcoded into it) can never accidentally be
  # downloaded as a plain file from the site.
  publish = "public"
  functions = "netlify/functions"
